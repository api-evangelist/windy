name: Windy
kind: company
description: Windy.com is a weather visualization platform serving high-resolution
  forecast models, animated weather maps, and a global webcam network. The Windy API
  exposes three developer products - a Point Forecast API for multi-model numerical
  weather data at a coordinate, an embeddable Map Forecast API based on Leaflet, and
  a Webcams API for the world's largest webcam repository.
