description: >-
  FinOps view of Windy API spend. Windy bills its three API products as fixed
  annual subscriptions rather than usage-based metering: Point Forecast and Map
  Forecast at 990 EUR/year each (Map Forecast adds an optional 1,000 EUR/year
  for ECMWF), and Webcams Professional at 9,990 EUR/year. Within each paid
  subscription a daily session/request quota applies (10,000/day, expandable by
  agreement). Free testing tiers carry no charge but cannot be used in
  production.
notes: >-
  Subscription prices are in EUR and subject to change; verify against the
  Windy API pricing pages during reconciliation. Because billing is
  subscription-based, cost optimization centers on right-sizing tiers and
  staying within daily quotas rather than per-call metering.
