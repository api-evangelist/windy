principles:
- name: Visibility
  description: Track each product's daily request/session burn against its quota in the Windy keys dashboard.
- name: Allocation
  description: Use separate service-specific keys per product and per workload/team to map subscription cost to cost centers.
- name: Optimization
  description: Right-size to the testing tier during development, only purchasing Professional for production; skip the ECMWF add-on unless required; consolidate webcam fetches to respect token TTLs.
- name: Accountability
  description: Review annual renewals and daily quota headroom before agreeing to expanded limits.
